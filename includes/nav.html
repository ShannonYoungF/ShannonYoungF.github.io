<header class="site-header">
  <a class="identity" href="{{locale_root}}index.html" aria-label="{{home_aria}}">
    <span class="avatar" aria-hidden="true">{{site_short_name}}</span>
    <span>{{site_name}}</span>
  </a>

  <button class="menu-button" type="button" aria-expanded="false" aria-controls="site-nav">
    <span></span><span></span><span></span>
    <span class="sr-only">{{menu_label}}</span>
  </button>

  <nav id="site-nav" class="site-nav" aria-label="{{nav_label}}">
    <a href="{{locale_root}}index.html">{{nav_home}}</a>
    <a href="{{locale_root}}blog.html?category=tech">{{nav_tech}}</a>
    <a href="{{locale_root}}blog.html?category=theory">{{nav_theory}}</a>
    <a href="{{locale_root}}blog.html?category=thought">{{nav_thought}}</a>
  </nav>

  <div class="header-actions">
    <a class="language-switch" href="{{language_switch_url}}" hreflang="{{other_html_lang}}" lang="{{other_html_lang}}" aria-label="{{language_switch_aria}}">{{language_switch_label}}</a>
    <a href="{{site_github}}" target="_blank" rel="noreferrer" aria-label="GitHub">GH</a>
    <button class="theme-button" type="button" aria-label="{{theme_label}}">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5a8.5 8.5 0 1 0 11.7 11.7Z"></path></svg>
    </button>
  </div>
</header>
