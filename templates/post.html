<!doctype html>
<html lang="{{html_lang}}">
<head>
  {{head}}
  <script>
    window.MathJax = {
      tex: { inlineMath: [["$", "$"], ["\\(", "\\)"]], displayMath: [["$$", "$$"], ["\\[", "\\]"]] },
      options: { skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"] }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
  <div id="reading-progress" class="reading-progress" aria-hidden="true"></div>
  {{nav}}

  <main class="post-shell">
    <article>
      <header class="post-header reveal">
        <a class="back-link" href="../blog.html?category={{category}}">← {{back_prefix}} {{category_label}}</a>
        <p class="post-category">{{category_label}}</p>
        <h1>{{title}}</h1>
        <p class="post-summary">{{summary}}</p>
        <div class="post-meta">
          <time datetime="{{date}}">{{date_display}}</time>
          <span>{{reading_time_label}}</span>
          <span>{{updated_prefix}} {{updated_display}}</span>
        </div>
        <div class="post-tags">{{tags_html}}</div>
      </header>

      <div class="post-body">
        {{body}}
      </div>

      <footer class="post-footer">
        <p>{{post_footer}} <a href="{{site_github}}" target="_blank" rel="noreferrer">GitHub</a>{{post_footer_suffix}}</p>
        <a class="text-link" href="../blog.html">{{continue_reading}} <span aria-hidden="true">↗</span></a>
      </footer>
    </article>
  </main>

  {{footer}}
  <script src="{{asset_root}}script.js"></script>
</body>
</html>
