<!doctype html>
<html lang="zh-CN">
<head>
  {{head}}
  <script>
    window.MathJax = {
      tex: { inlineMath: [["$", "$"], ["\\(", "\\)"]], displayMath: [["$$", "$$"], ["\\[", "\\]"]] },
      options: { skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"] }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
  <div id="reading-progress" class="reading-progress" aria-hidden="true"></div>
  {{nav}}

  <main class="post-shell">
    <article>
      <header class="post-header reveal">
        <a class="back-link" href="../blog.html?category={{category}}">← 返回{{category_label}}</a>
        <p class="post-category">{{category_label}}</p>
        <h1>{{title}}</h1>
        <p class="post-summary">{{summary}}</p>
        <div class="post-meta">
          <time datetime="{{date}}">{{date_display}}</time>
          <span>{{reading_time}} 分钟阅读</span>
          <span>最后更新于 {{updated_display}}</span>
        </div>
        <div class="post-tags">{{tags_html}}</div>
      </header>

      <div class="post-body reveal">
        {{body}}
      </div>

      <footer class="post-footer">
        <p>如果这篇笔记对你有帮助，或你发现了错误，欢迎通过<a href="{{site_github}}" target="_blank" rel="noreferrer">GitHub</a>交流。</p>
        <a class="text-link" href="../blog.html">继续阅读 <span aria-hidden="true">↗</span></a>
      </footer>
    </article>
  </main>

  {{footer}}
  <script src="../script.js"></script>
</body>
</html>
