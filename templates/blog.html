<!doctype html>
<html lang="{{html_lang}}">
<head>
  {{head}}
</head>
<body>
  <canvas id="constellation" aria-hidden="true"></canvas>
  {{nav}}

  <main id="top" class="blog-shell">
    <section class="page-intro reveal">
      <p class="section-kicker">Writing archive</p>
      <h1>{{blog_title}}</h1>
      <p>{{blog_intro}}</p>
    </section>

    <section class="archive-section reveal" aria-label="{{archive_aria}}">
      <div class="filter-toolbar">
        <div class="filter-group" aria-label="{{filter_aria}}">
          <button class="filter-button is-active" type="button" data-filter="all">{{filter_all}} <span>{{total_count}}</span></button>
          <button class="filter-button" type="button" data-filter="tech">{{filter_tech}} <span>{{tech_count}}</span></button>
          <button class="filter-button" type="button" data-filter="theory">{{filter_theory}} <span>{{theory_count}}</span></button>
          <button class="filter-button" type="button" data-filter="thought">{{filter_thought}} <span>{{thought_count}}</span></button>
        </div>
        <label class="search-box">
          <span class="sr-only">{{search_label}}</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
          <input id="post-search" type="search" placeholder="{{search_placeholder}}" autocomplete="off">
        </label>
      </div>

      <div id="entry-list" class="entry-list">
        {{all_posts}}
      </div>
      <p id="empty-state" class="empty-state" hidden>{{empty_state}}</p>
    </section>
  </main>

  {{footer}}
  <script src="{{asset_root}}script.js"></script>
</body>
</html>
