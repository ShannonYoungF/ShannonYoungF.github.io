<!doctype html>
<html lang="zh-CN">
<head>
  {{head}}
</head>
<body>
  <canvas id="constellation" aria-hidden="true"></canvas>
  {{nav}}

  <main id="top" class="blog-shell">
    <section class="page-intro reveal">
      <p class="section-kicker">Writing archive</p>
      <h1>文章与笔记</h1>
      <p>按时间保留想法的变化。文章可能会在理解加深后继续修订。</p>
    </section>

    <section class="archive-section reveal" aria-label="文章列表">
      <div class="filter-toolbar">
        <div class="filter-group" aria-label="文章分类">
          <button class="filter-button is-active" type="button" data-filter="all">全部 <span>{{total_count}}</span></button>
          <button class="filter-button" type="button" data-filter="tech">技术 <span>{{tech_count}}</span></button>
          <button class="filter-button" type="button" data-filter="theory">理论 <span>{{theory_count}}</span></button>
          <button class="filter-button" type="button" data-filter="thought">思考 <span>{{thought_count}}</span></button>
        </div>
        <label class="search-box">
          <span class="sr-only">搜索文章</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
          <input id="post-search" type="search" placeholder="搜索标题、摘要或标签…" autocomplete="off">
        </label>
      </div>

      <div id="entry-list" class="entry-list">
        {{all_posts}}
      </div>
      <p id="empty-state" class="empty-state" hidden>没有找到对应的文章，试试别的关键词。</p>
    </section>
  </main>

  {{footer}}
  <script src="script.js"></script>
</body>
</html>
